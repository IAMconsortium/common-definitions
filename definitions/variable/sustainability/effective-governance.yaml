- Gender Inequality Index:
    description: Geometric average of reproductive health, empowerment and labor market
      force participation rate (see Andrijevic et al., 2020)
    unit:
    sdg: 5
    weight: Population

- Political Institutions|Equality Before Law and Individual Liberty:
    description: Aggregated 'Equality Before the Law and Individual Liberty' index as
      defined by 'Varieties of Democracy' (V-DEM, Coppedge et al. 2022, Pemstein et al. 2022)
    unit:
    sdg: 16
    weight: Population
    shape: Political Institutions|Equality before law and individual liberty

- Political Institutions|Corruption Perceptions Index:
    description: The perception of corruption measures the perceived levels of public sector 
        corruption, as defined by transparency international. See also:
        https://files.transparencycdn.org/images/CPI2010_long_methodology_En.pdf
    unit: Index
    sdg: 16
    weight: Population

- Political Institutions|Governance Effectivness:
    description: Captures perceptions of the quality of public services, the civil
        service, policy formulation and implementation, and the credibility of a government’s decisions.
        Based on the World Bank Governance Indicators. see also:
        https://www.worldbank.org/content/dam/sites/govindicators/doc/GE-2026.pdf
    unit: Index
    sdg: 16
    weight: Population
