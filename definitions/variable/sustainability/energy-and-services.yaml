- Useful Energy:
    description: Useful energy consumption by all end-use sectors and all fuels, including non-energy use, excluding transmission/distribution losses
    unit: EJ/yr
    tier: 1
    note: Report in fuel-equivalent

- Useful Energy (w/o bunkers):
    description: Useful energy consumption by all end-use sectors and all fuels including non-energy use, excluding international aviation and shipping (see 'Useful Energy|Bunkers|*') and excluding transmission/distribution losses
    unit: EJ/yr
    tier: 2
    note: Report in fuel-equivalent

- Useful Energy|Agriculture:
    description: Useful energy consumption by the agriculture sector including fishing
    unit: EJ/yr
    tier: 2
    note: Report in fuel-equivalent

- Useful Energy|Bunkers:
    description: Useful energy consumption by the international aviation and shipping
    unit: EJ/yr
    tier: 2
    note: Report in fuel-equivalent

- Useful Energy|Carbon Management:
    description: Total energy use for carbon management, i.e., capture and/or removal of CO2
    unit: EJ/yr
    tier: 3
    note: Report in fuel-equivalent

- Useful Energy|Commercial:
    description: Useful energy consumption by the commercial sector
    unit: EJ/yr
    tier: 2
    note: Report in fuel-equivalent

- Useful Energy|Industry:
    description: Useful energy consumption by the industrial sector excluding non-energy use (e.g.feedstocks)
    unit: EJ/yr
    tier: 1
    note: Report in fuel-equivalent

- Useful Energy|Other Sector:
    description: Useful energy consumption by the other sectors
    unit: EJ/yr
    tier: 2
    note: Report in fuel-equivalent

- Useful Energy|Residential:
    description: Useful energy consumption by the residential sector
    unit: EJ/yr
    tier: 2
    note: Report in fuel-equivalent

- Useful Energy|Residential and Commercial:
    description: Useful energy consumption by the residential and commercial sector
    unit: EJ/yr
    tier: 1
    note: Report in fuel-equivalent

- Useful Energy|Transportation:
    description: Useful energy consumption by the transportation sector excluding international aviation and shipping (see 'Bunkers')
    unit: EJ/yr
    tier: 1
    note: Report in fuel-equivalent

- Useful Energy|Transportation|Passenger:
    description: Useful energy for passenger transport
    unit: EJ/yr
    tier: 2
    note: Report in fuel-equivalent

- Useful Energy|Transportation (w/ bunkers):
    description: Useful energy consumption by the transportation sector including international aviation and shipping
    unit: EJ/yr
    tier: 2
    note: Report in fuel-equivalent

- Energy Service|Transportation|Freight:
    description: Energy service demand for freight transport
    unit: billion tkm/yr

- Energy Service|Transportation|Passenger:
    description: Energy service demand for passenger transport
    unit: billion pkm/yr
    tier: 1

- Energy Service|Transportation|Passenger|Road:
    description: Energy service demand for passenger transport on roads
    unit: billion pkm/yr
    sdg: 7

- Energy Service|Transportation|Passenger|Active Transport [Share]:
    description: Share of walking and cycling in passenger transport
    unit: '%'
    range: [ 0, 100 ]
    sdg: 7
    skip-region-aggregation: true
    #     weight: Energy Service|Transportation|Passenger
    shape: Energy Service|Transportation|Passenger|ActiveTransport|Share

- Energy Service|Transportation|Passenger|Public Transport [Share]:
    description: Share of public transit in passenger transport
    unit: '%'
    range: [ 0, 100 ]
    sdg: 7
    skip-region-aggregation: true
    #     weight: Energy Service|Transportation|Passenger
    shape: Energy Service|Transportation|Passenger|PublicTransport|Share

- Energy Service|Residential|Cooling Degree Days:
    description: Measure of how hot the temperature was over a given period
      indicating higher energy needs for cooling
    unit: °C-days
    sdg: 7
    skip-region-aggregation: true
    tier: 2
    #weight: Energy Service|Residential|Floor Space

- Energy Service|Residential|Heating Degree Days:
    description: Measure of how cold the temperature was over a given period
      indicating higher energy needs for heating
    unit: °C-days
    sdg: 7
    skip-region-aggregation: true
    tier: 2
    #weight: Energy Service|Residential|Floor Space

- Final Energy|Industry|Electricity [Share]:
    description: Share of electricity in final energy demand for industry
    unit: '%'
    sdg: 7
    weight: Final Energy|Industry|Electricity
    shape: Final Energy|Industry|Electricity|Share

- Intensity|Final Energy:
    description: Final Energy intensity
    unit: EJ/billion USD_2010
    sdg: 7
    weight: GDP|PPP
