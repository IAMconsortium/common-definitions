      due to outdoor air pollution of fine particles with a diameter of 2.5 μm or
      less (PM2.5)
    unit: DALY
    sdg: 3
    shape: Disability-Adjusted Life Year|Air Pollution|Outdoor|PM2.5
    min: 0

