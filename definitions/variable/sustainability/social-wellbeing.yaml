# --- Population Exposed to Air Pollution ---

- Population|Air Pollution|Outdoor|PM2.5|{Urban and Rural}:
    description: Population exposed to outdoor fine particles with a diameter
      of 2.5 μm or less (PM2.5) concentrations above the WHO Global Air Quality Guidelines
      (5 µg/m3 annual mean)
    unit: million
    min: 0

- Population|Air Pollution|Outdoor|O3|{Urban and Rural}:
    description: Population exposed to outdoor ozone (O3) concentrations above the WHO
      Global Air Quality Guidelines (60 µg/m3 peak season mean, i.e. 6-month average
      of daily maximum 8-hour mean)
    unit: million
    min: 0

- Population|Air Pollution|Outdoor|NO2|{Urban and Rural}:
    description: Population exposed to outdoor nitrogen dioxide (NO2) concentrations
      above the WHO Global Air Quality Guidelines (10 µg/m3 annual mean)
    unit: million
    min: 0


