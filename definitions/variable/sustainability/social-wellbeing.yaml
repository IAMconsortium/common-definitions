# --- Air Pollution (Concentrations) ---

- Air Pollution|Outdoor|PM2.5:
    description: Population-weighted annual average of outdoor fine particles with
      a diameter of 2.5 μm or less (PM2.5) concentrations.
    unit: μg/m3
    sdg: 11
    weight: Population
    min: 0

- Air Pollution|Outdoor|PM2.5|Urban Population:
    description: Urban population-weighted annual average of outdoor fine particles
      with a diameter of 2.5 μm or less (PM2.5) concentrations.
